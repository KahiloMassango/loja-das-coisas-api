# Local Development Profile (SQLite)
spring.datasource.url=jdbc:sqlite:database.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Local upload directory
file.upload-dir=src/main/upload/images
spring.web.resources.static-locations=classpath:/static/, file:src/main/upload/images/

# App & CORS
app.base-url=http://localhost:8080
cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:8080
