# Production Profile (PostgreSQL - Dokploy)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/storedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:superUser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Persistent uploads (mapped to Dokploy volume)
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}
spring.web.resources.static-locations=classpath:/static/, file:${file.upload-dir}/

# Application & CORS
app.base-url=${APP_BASE_URL:http://localhost:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
