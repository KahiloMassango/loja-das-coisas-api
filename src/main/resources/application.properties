spring.application.name=product-ms

# Active profile defaults to 'dev' for zero-friction local debug
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common JWT configuration
jwt.key=${JWT_KEY:"EgZjaHJvbWUqBwgCECEYoAEyBggAEEUYOTIHCAEQIRigATIHCAIQIRigATIHCAMQIRigATIHCAQQIRigATIHCAUQIRigATIHCAYQIRiPAjIHCAcQIRiPAtIBCDQwOTNqMGo3qAIAsAIA"}
# 30min
jwt.access.token.expiration=1800000
# 7 days
jwt.refresh.token.expiration=604800000

# Multipart configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# Actuator endpoints (used by Dokploy / Docker health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

